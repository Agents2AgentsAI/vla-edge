[project]
name = "vla-edge"
version = "0.1.0"
description = "Run flow-matching vision-language-action policies fast on edge hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Agents2Agents" }]
keywords = ["robotics", "vla", "inference", "edge", "tensorrt", "coreml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately minimal. The model definition is loaded from the checkpoint via
# transformers `trust_remote_code`; we do not vendor it. Backend toolchains
# (TensorRT, CoreML, NPU SDKs) are per-platform extras because none of them
# install cleanly everywhere.
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "json-numpy>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
torch = ["torch>=2.5", "transformers>=4.57,<5", "accelerate", "safetensors", "huggingface-hub", "einops"]
tensorrt = ["tensorrt>=10.13", "cuda-python"]
abcvla = ["torch>=2.5", "safetensors>=0.5", "sentencepiece>=0.2", "msgpack>=1.0", "websockets>=14", "opencv-python>=4.9"]
pi05 = ["torch>=2.5", "safetensors>=0.5", "sentencepiece>=0.2", "ruckig==0.15.3"]
coreml = ["coremltools>=8.0", "mlx>=0.20"]
eval = ["imageio[ffmpeg]"]
camera = ["pyzmq>=25.0", "opencv-python>=4.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "msgpack>=1.0", "httpx>=0.27", "pyyaml>=6.0", "ruckig==0.15.3"]

[project.urls]
Homepage = "https://agents2agents.ai"
Source = "https://github.com/Agents2AgentsAI/vla-edge"

[project.scripts]
vla-edge-serve = "vla_edge.serving.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_edge"]

[tool.ruff]
line-length = 88
target-version = "py310"

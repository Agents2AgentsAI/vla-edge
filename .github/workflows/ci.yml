name: ci

on:
  push:
  pull_request:

# CI runs without accelerator toolchains. The shared runtime must remain
# importable and testable with only the development dependencies installed.

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest -q tests/

  no-artifacts:
    name: no weights or compiled artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree
        run: |
          matches=$(git ls-files | grep -E \
            '\.(plan|engine|safetensors|gguf|mlpackage|mlmodelc|onnx|pt|pth|bin)$' \
            || true)
          if [ -n "$matches" ]; then
            echo "Model weights or compiled artifacts are present in the tree:"
            echo "$matches"
            echo "These are never committed. See CONTRIBUTING.md and NOTICE."
            exit 1
          fi
          echo "clean"
